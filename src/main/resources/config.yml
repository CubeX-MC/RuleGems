# ==========================================
# RuleGems 插件配置
# ==========================================
# 配置分层建议：
# - config.yml：全局玩法开关与默认行为
# - features/*.yml：独立功能的启用状态和运行参数
# - gems/*.yml：宝石内容定义、展示、祭坛与生成范围
# - powers/*.yml：可复用的能力模板与委任结构
# 如果你想先跑通玩法，优先只改本文件和 gems/*.yml。

config-version: 3

# 语言设置 (示例: zh_CN / en_US)
language: zh_CN

# 文档与社区链接，会显示在 /rg help 和启动日志中
links:
  documentation: "https://github.com/CubeX-MC/RuleGems"
  discord: "https://discord.com/invite/7tJeSZPZgv"
  qq: "https://pd.qq.com/s/1n3hpe4e7?b=9"

# 数据存储后端。支持 yaml 与 sqlite。
storage:
  type: yaml
  sqlite:
    file: data/rulegems.db

# 安全设置
# allow_op_escalation: 是否允许使用临时 OP 执行限次命令（不推荐）
# 设为 false 时，player-op 类型命令将回退为以控制台身份执行
# 需要玩家上下文但不提权的命令请使用 player: 前缀，并在 power 中授予对应权限
# 设为 true 时，会临时授予玩家 OP 来执行命令（存在安全风险）
allow_op_escalation: false

# Vault 的通用 API 不提供跨账户数据库事务。内置 transfer: 指令默认关闭；
# 建议优先调用经济插件自己的转账命令。只有接受补偿回滚的剩余风险时才启用。
economy:
  transfer_directives_enabled: false

# 宝石随机生成范围（默认）
# 这是全局默认的生成范围，当宝石没有单独配置生成范围时使用
# 每个宝石可以在其配置文件中通过 random_place_range 字段设置自己的生成范围
# 注意：随机放置只使用 corner1/corner2 的 X、Z 范围；Y 会自动取该 X/Z 处的最高方块之上一格，
#       因此下方的 y 值仅作占位，不参与计算。
random_place_range:
  world: world
  corner1: { x: -100, y: 64, z: -100 }
  corner2: { x: 100, y: 64, z: 100 }

# 宝石在世界中的表现方式。修改后执行 /rg reload 即可原地切换，
# 不需要重新 scatter，也不会改变已放置宝石的坐标或 UUID。
gem_presentation:
  # block: 传统真实方块，可像普通方块一样挖掘
  # proximity_display: 世界中不保留特殊宝石方块；玩家靠近后才显示可左键拾取的展示实体
  mode: block
  # 进入此距离后显示宝石
  reveal_range: 16
  # 离开此距离后隐藏宝石；应不小于 reveal_range，避免边界反复闪烁
  hide_range: 20

# 全局设置
toggles:
  broadcast_redeem_title: true  # 兑换后是否向全服广播

# 集齐全部宝石后的奖励配置
redeem_all:
  broadcast: true
  titles:
    - "&a%player% 集齐了全部宝石！"
    - "&e获得了至高权力！"
  sound: ENTITY_ENDER_DRAGON_GROWL
  permissions: []  # 额外授予的永久权限
  permission_groups: [] # 集齐全部宝石后授予的权限组（LuckPerms/Vault/Bukkit provider）
  # 集齐后额外授予的限次自定义指令
  # command_allows 格式说明：
  #   - command: 玩家输入的命令
  #     execute: 实际执行的命令列表（支持 console:、player: 或 player-op: 前缀）
  #     time_limit: 可用次数（-1=无限）
  #     cooldown: 冷却时间（秒）
  # 占位符：%player%=玩家名, %arg1%=第1个参数, %arg2|默认%=第2个参数或默认值
  command_allows: []

# 阶梯式收集组：当玩家兑换的不同宝石类型数量达到阈值时授予对应权限组
# 示例:
# gem_collect_thresholds:
#   2: "noble"
#   4: "lord"
gem_collect_thresholds: {}

# ==========================================
# 全局事件配置
# ==========================================

# 权力强制回收
revoke_power:
  commands:
    - "say §c%player% 的权力被强制回收！"
  sound: ENTITY_ENDERMAN_TELEPORT
  particle: FLAME

# 宝石集齐时触发（预留给集齐全套事件；当前 redeem_all 使用 redeem_all 配置）
gem_union_execute:
  commands:
    - "say §a%player% 集齐了所有宝石！"
  sound: ENTITY_PLAYER_LEVELUP
  particle: TOTEM

# 宝石散落时触发
gem_scatter_execute:
  commands:
    - "say §c权力宝石散落了！"
  sound: ENTITY_WITHER_SPAWN
  particle: EXPLOSION

# 授权策略（五种兑换方式）
grant_policy:
  inventory_grants: false      # 方式1: 拾取后立即生效
  redeem_enabled: true         # 方式2: 允许使用 /rulegems redeem 兑换
  full_set_grants_all: true    # 方式3: 允许使用 /rulegems redeemall 一次性兑换全部
  place_redeem_enabled: false  # 方式4: 在祭坛位置放置宝石兑换（每颗宝石的祭坛位置在gems配置中设置）
  hold_to_redeem_enabled: true # 方式5: 手持宝石长按右键3秒"吃掉"宝石进行兑换（更有仪式感）

# ==========================================
# 放置兑换（祭坛模式）全局设置
# ==========================================
# 每颗宝石的祭坛位置在 gems/*.yml 中通过 altar 字段设置
# 或使用命令 /rulegems setaltar <宝石key> 来设置
place_redeem:
  # 允许的放置半径（方块数），0 表示必须精确放置在祭坛坐标
  radius: 1
  # 兑换时播放的音效
  sound: BLOCK_BEACON_ACTIVATE
  # 兑换时的粒子效果
  particle: TOTEM
  # 是否播放信标光束特效
  beacon_beam: true
  # 信标光束持续时间（秒）
  beacon_beam_duration: 5

# ==========================================
# 长按右键兑换设置
# ==========================================
# 手持宝石长按右键"吃掉"宝石进行兑换
hold_to_redeem:
  # 长按时长（秒），默认3秒
  duration: 3
  # 下蹲行为设置
  # sneak_to_redeem: true  - 下蹲+长按右键兑换，普通右键可放置宝石（默认，推荐）
  # sneak_to_redeem: false - 普通长按右键兑换，下蹲+右键可放置宝石
  sneak_to_redeem: true

# ==========================================
# 药水效果施加策略（真相宝石的夜视等）
# ==========================================
# 为防止"孤儿效果"（插件重载/玩家掉线未重新授权时效果残留），效果采用
# “限时 + 周期重施”而非无限时长：每隔 refresh_interval 重新施加一次 duration 时长的效果。
#
# 重要：duration 必须比 refresh_interval 大 10 秒以上，否则夜视会一直闪烁——
# 这是客户端写死的“效果剩余≤10秒”临期提示，插件无法关闭。
# 程序会自动钳制不安全的取值（会上调 duration 并在控制台提示），但建议直接配成安全值。
effects:
  # 单次施加的效果时长（秒）。默认 20，务必 > 10。
  duration: 20
  # 重新施加的间隔（秒）。默认 3，应显著小于 duration。
  refresh_interval: 3

# ==========================================
# 宝石逃逸机制
# ==========================================
# 防止统治者将宝石永久藏起来导致权力无法流转。
# 启用后使用一个全局轮次调度器：每轮最多移动一颗符合条件的已放置宝石，
# 因此这里的 min_interval / max_interval 控制全服流动速率，而不是每颗宝石各自的计时器。
gem_escape:
  # 是否启用逃逸功能
  enabled: false
  # 两次全局逃逸轮次之间的随机最小/最大间隔
  # 支持的单位: s(秒), m(分钟), h(小时), d(天)
  # 示例: "30m", "2h", "1d", "90s"
  # 也可以直接写数字，默认单位为分钟
  min_interval: "30m"
  max_interval: "2h"
  # 宝石在同一位置至少停留这么久，才会进入逃逸候选池
  minimum_unmoved_duration: "4h"
  selection:
    # 统计同世界附近宝石数量的半径；聚集越密集，被选中的概率越高
    cluster_radius: 96
    # 每多一颗附近宝石所使用的权重倍率；最低会钳制为 1.0
    cluster_weight: 2.0
  local_move:
    # 第一轮局部逃逸的距离环带（方块）
    min_distance: 96
    max_distance: 256
    # 后续失败轮次向外扩展的距离（方块）
    distance_growth: 256
    # 每轮尝试验证的候选位置数（1-64）
    attempts_per_round: 10
    # 连续失败达到 N 轮后，只把这一颗宝石在 random_place_range 内全局重新散落（1-16）
    max_failed_rounds: 3
    # 一轮找不到安全位置后，等待多久再试
    retry_delay: "15m"
    # 多次局部逃逸仍未被拾取时，触发单颗全局重新散落（1-64）
    max_local_escapes_without_pickup: 3
  # 是否广播逃逸消息
  broadcast: true
  # 逃逸时播放的音效（留空则不播放）
  sound: ENTITY_ENDERMAN_TELEPORT
  # 逃逸时的粒子效果（留空则不播放）
  particle: PORTAL
